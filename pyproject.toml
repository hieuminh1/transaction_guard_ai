[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "transactionguard-ai"
version = "0.1.0"
description = "Leakage-aware synthetic transaction fraud scoring"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<1.8",
  "fastapi>=0.115,<0.121", "uvicorn>=0.30,<0.39", "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3", "joblib>=1.4,<2", "matplotlib>=3.9,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<0.29", "ruff>=0.11,<0.15"]
db = ["SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"]
dashboard = ["streamlit>=1.40,<2", "httpx>=0.27,<0.29"]
tracking = ["mlflow>=2.20,<4"]

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
